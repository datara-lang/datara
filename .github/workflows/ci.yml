name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy correctness check
        run: cargo clippy --all-targets -- -D clippy::correctness

      - name: Check editor syntax sync
        run: python scripts/gen_editor_syntax.py --check

      - name: Benchmark smoke test
        run: cargo bench --no-run

      - name: Recursion depth safety
        run: cargo test --test test_recursion_depth_limit -- --nocapture

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --verbose

      - name: Test (Windows)
        if: runner.os == 'Windows'
        # -j 2 reduces concurrent linking, which is unreliable on Windows.
        # Skip heavy comparative benchmarks in standard PR/push matrix to avoid timeouts.
        run: cargo test --release -j 2 --no-fail-fast -- --skip bench

      - name: Test Compiler Core & CLI Tools (Non-Windows)
        if: runner.os != 'Windows'
        run: |
          cargo test --release --lib -j 2 --no-fail-fast
          cargo test --release --bins -j 2 --no-fail-fast

      - name: Test Extended Suite (Non-Windows)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: cargo test --release -j 2 --no-fail-fast -- --skip bench

  clippy-count:
    name: Clippy warning count gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Verify warnings do not exceed baseline
        shell: pwsh
        run: |
          $baseline = [int](Get-Content .clippy_baseline -Raw).Trim()
          $output = cargo clippy --all-targets --message-format short 2>&1
          $warns = ($output | Select-String -Pattern "warning:").Count
          if (-not $warns) { $warns = 0 }
          Write-Host "Current Clippy Warnings: $warns (Baseline: $baseline)"
          if ($warns -gt $baseline) {
            Write-Error "Clippy warnings regression detected: $warns > $baseline"
            exit 1
          }
          exit 0

  asan:
    name: AddressSanitizer (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Run tests with ASan
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
        run: cargo +nightly test --lib --target x86_64-unknown-linux-gnu --release -j 2 --no-fail-fast

  msrv:
    name: Minimum Supported Rust Version (1.94.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: cargo check --lib --bins

  wasm-runtime:
    name: WebAssembly Runtime Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - name: Run WASM validation and differential tests
        run: |
          cargo test --test test_wasm_validation
          cargo test --test test_backend_differential
      - name: Run WASM smoke suite with Node.js runtime loader
        run: |
          cargo run --bin datara -- build examples/01_vertical_slice.dtr --target=wasm32
          node --input-type=module -e "import { loadDataraModule } from './examples/01_vertical_slice.js'; loadDataraModule('./examples/01_vertical_slice.wasm').then(m => m.main && m.main());"

  m4-stress:
    name: M4 large-program stress gate
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install RSS sampler
        run: python -m pip install psutil

      - uses: Swatinem/rust-cache@v2

      - name: Build release compiler
        run: cargo build --release --bin forgen

      - name: Find previous successful M4 baseline
        id: find-baseline
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              status: 'success',
              per_page: 100,
            });
            for (const run of runs) {
              if (run.id === context.runId) continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              if (artifacts.some(artifact => artifact.name === 'm4-stress-baseline' && !artifact.expired)) {
                core.setOutput('run-id', String(run.id));
                core.info(`Using successful M4 baseline from workflow run ${run.id}`);
                return;
              }
            }
            core.info('No prior M4 report found; this run establishes the first baseline.');

      - name: Download previous baseline
        if: steps.find-baseline.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: m4-stress-baseline
          path: m4-baseline
          run-id: ${{ steps.find-baseline.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run 50k stress gate
        run: |
          args=(--sizes 50000 --timeout-seconds 900 --output m4-stress-report.json)
          if [ -f m4-baseline/m4-stress-report.json ]; then
            args+=(--baseline m4-baseline/m4-stress-report.json --max-regression 2.0)
          fi
          python tools/bench_stress.py "${args[@]}"

      - name: Upload M4 baseline report
        if: always() && hashFiles('m4-stress-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: m4-stress-baseline
          path: m4-stress-report.json
          retention-days: 90

  slow-tests:
    name: Slow Tests (Scheduled / Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Slow Tests
        run: cargo test --release -j 2 -- --ignored slow_



