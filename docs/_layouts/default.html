---
layout: default
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — Datara Docs{% else %}Datara Documentation{% endif %}</title>
    <meta name="description" content="Official documentation for the Datara systems programming language and the Forgen compiler toolchain.">
    <link rel="icon" type="image/x-icon" href="{{ site.baseurl }}/../assets/datara.ico">
    <style>
        :root {
            --bg-primary: #0a0f1d;
            --bg-secondary: #111827;
            --bg-card: #1e293b;
            --bg-code: #0f172a;
            --border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-blue: #0284c7;
            --accent-green: #4ade80;
            --font-code: 'Consolas', 'Fira Code', 'Courier New', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            overflow-wrap: break-word;
        }

        /* Header */
        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10, 15, 29, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
        }
        .nav-content { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
        .container { max-width: 980px; margin: 0 auto; padding: 0 24px; }
        .logo-group { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .logo-group img { width: 28px; height: 28px; }
        .logo-group span { font-size: 17px; font-weight: 700; color: #fff; }
        .nav-links { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .nav-links a { color: var(--text-secondary); font-size: 14px; font-weight: 500; }
        .nav-links a:hover { color: #fff; text-decoration: none; }

        /* Content */
        main { padding: 48px 0 24px; }
        h1 { font-size: 36px; font-weight: 800; line-height: 1.2; margin: 0 0 20px; letter-spacing: -0.5px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        h2 { font-size: 27px; font-weight: 700; margin: 40px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        h3 { font-size: 20px; font-weight: 700; margin: 28px 0 12px; }
        h4 { font-size: 16px; font-weight: 700; margin: 20px 0 10px; }
        p { margin: 0 0 16px; }
        ul, ol { margin: 0 0 16px; padding-left: 28px; }
        li { margin-bottom: 6px; }
        a { color: var(--accent-cyan); text-decoration: none; }
        a:hover { text-decoration: underline; }
        strong { color: #fff; }

        blockquote {
            margin: 0 0 16px; padding: 12px 20px;
            background: var(--bg-secondary);
            border-left: 4px solid var(--accent-blue);
            border-radius: 0 8px 8px 0;
            color: var(--text-secondary);
        }
        blockquote p:last-child { margin-bottom: 0; }

        code {
            font-family: var(--font-code);
            font-size: 0.9em;
            background: var(--bg-code);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px 6px;
        }
        pre {
            background: var(--bg-code);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 18px;
            overflow-x: auto;
            margin: 0 0 20px;
            line-height: 1.5;
        }
        pre code { background: none; border: none; padding: 0; font-size: 13px; }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; margin: 0 0 20px; }
        th, td { padding: 10px 14px; border: 1px solid var(--border); }
        th { background: var(--bg-card); color: var(--text-secondary); font-weight: 600; }
        tr:nth-child(even) td { background: var(--bg-secondary); }

        hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
        img { max-width: 100%; height: auto; }

        /* Footer nav */
        .doc-footer {
            margin-top: 64px; padding: 24px 0;
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
            color: var(--text-secondary); font-size: 14px;
        }
        .doc-footer a { font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <div class="container nav-content">
            <div class="logo-group">
                <img src="{{ site.baseurl }}/../assets/datara.ico" alt="Datara Logo">
                <span>Datara Docs</span>
            </div>
            <nav class="nav-links">
                <a href="{{ '/DOCUMENTATION.html' | relative_url }}">All Docs</a>
                <a href="{{ '/DATARA_LANGUAGE_REFERENCE_MANUAL.html' | relative_url }}">Language Reference</a>
                <a href="{{ '/TUTORIAL.html' | relative_url }}">Tutorial</a>
                <a href="{{ '/GLOSSARY.html' | relative_url }}">Glossary</a>
                <a href="{{ '/' | relative_url }}">Home</a>
                <a href="https://github.com/datara-lang/datara" target="_blank" rel="noopener">GitHub</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {{ content }}
        <script>
        // Markdown sources link to each other via `FOO.md` URLs (they work in the
        // repository). On the published site pages live at `FOO.html`, so rewrite
        // those links in place instead of leaving visitors on 404s.
        (function () {
            var here = location.pathname.replace(/[^/]*$/, '');
            document.querySelectorAll('a[href]').forEach(function (a) {
                var href = a.getAttribute('href');
                if (!href || href.startsWith('http') || href.startsWith('#')) return;
                if (!/\.md(#.*)?$/.test(href)) return;
                a.setAttribute('href', href.replace(/\.md(?=#|$)/, '.html'));
            });
            // If a visitor lands on a .md URL anyway, bounce to the .html page.
            if (/\.md$/.test(location.pathname)) {
                location.replace(location.pathname.replace(/\.md$/, '.html') + location.search + location.hash);
            }
        })();
        </script>
        <div class="doc-footer">
            <a href="{{ '/DOCUMENTATION.html' | relative_url }}">&larr; Documentation Map</a>
            <span>Datara &amp; Forgen &bull; Apache 2.0 / MIT</span>
            <a href="https://github.com/datara-lang/datara" target="_blank" rel="noopener">GitHub &rarr;</a>
        </div>
    </main>
</body>
</html>
